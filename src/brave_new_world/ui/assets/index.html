<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BraveNewWorld · 一阶系统</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">BRAVE NEW WORLD · BNW-0</p>
        <h1>一阶系统与低通滤波</h1>
        <p class="intro">调节参数，观察 <code>τ dy/dt + y = K u</code> 的真实确定性仿真结果。</p>
      </header>

      <section class="workspace" aria-label="仿真实验">
        <form id="controls" class="controls">
          <label>输入幅值 u <input name="input_amplitude" type="number" value="1" step="0.1" required></label>
          <label>系统增益 K <input name="gain" type="number" value="1" step="0.1" required></label>
          <label>时间常数 τ / s <input name="time_constant_s" type="number" value="0.8" min="0.01" step="0.05" required></label>
          <label>初始输出 y(0) <input name="initial_output" type="number" value="0" step="0.1" required></label>
          <label>仿真时长 / s <input name="duration_s" type="number" value="5" min="0.1" step="0.1" required></label>
          <label>固定步长 / s <input name="dt_s" type="number" value="0.05" min="0.001" step="0.01" required></label>
          <div class="actions">
            <button type="submit">运行仿真</button>
            <button id="reset" type="button" class="secondary">恢复默认</button>
            <button id="export" type="button" class="secondary" disabled>导出 JSON</button>
          </div>
        </form>

        <div class="result">
          <div id="status" class="status" role="status">等待仿真</div>
          <canvas id="plot" width="900" height="480" aria-label="输入与输出时域曲线"></canvas>
          <dl id="metrics" class="metrics"></dl>
        </div>
      </section>

      <section class="learning">
        <h2>观察要点</h2>
        <p>约一个时间常数后，输出完成总变化量的 63.2%；增大 τ 会减慢响应，但不会改变稳态目标 K·u。</p>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
